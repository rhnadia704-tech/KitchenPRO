name: Android CI - GASTRO APK Build (with Embedded AI Secret)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Inject GEMINI_API_KEY into .env for Secrets Gradle Plugin (Zero Runtime Key Entry)
        env:
          GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY_SECRET" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY_SECRET" > .env
            echo "[GASTRO-CI] GEMINI_API_KEY injected from GitHub Repository Secrets into BuildConfig.GEMINI_API_KEY."
          else
            cp .env.example .env
            echo "[GASTRO-CI] No GEMINI_API_KEY secret found in GitHub; using .env.example (GASTROengine Anti-Quota Local AI Engine will remain active)."
          fi

      - name: Ensure debug.keystore exists for signing
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Assemble GASTRO Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: Upload GASTRO Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GASTRO-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
